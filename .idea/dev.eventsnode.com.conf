server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name dev.eventsnode.com;

    ssl_certificate_key /etc/nginx/ssl-certificates/dev.eventsnode.com.key;
    ssl_certificate /etc/nginx/ssl-certificates/dev.eventsnode.com.crt;

    root /home/eventsnode-dev/htdocs/dev.eventsnode.com/public_html/frontend;
    index index.html;

    access_log /home/eventsnode-dev/logs/nginx/access.log main;
    error_log /home/eventsnode-dev/logs/nginx/error.log;

    # Redirect HTTP to HTTPS
    if ($scheme != "https") {
        rewrite ^ https://$host$uri permanent;
    }

    # === Backend API Proxy ===
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /dev-eventsnode/ {
        proxy_pass http://127.0.0.1:9000/dev-eventsnode/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # === MinIO Console (Admin Panel) Proxy ===
    location /minio/ {
        proxy_pass http://127.0.0.1:9001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Fix asset and API paths inside MinIO console
        sub_filter_once off;
        sub_filter 'href="/' 'href="/minio/';
        sub_filter 'src="/' 'src="/minio/';
        sub_filter 'action="/' 'action="/minio/';
        sub_filter 'fetch("/' 'fetch("/minio/';
        sub_filter 'window.location="/' 'window.location="/minio/';

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }


    # Serve React App
    location / {
        try_files $uri /index.html;
    }

    # Serve Static Files
    location /assets/ {
        root /home/eventsnode-dev/htdocs/dev.eventsnode.com/public_html/frontend/dist;
    }

    # Allow Let's Encrypt certificate verification
    location ~ /.well-known {
        allow all;
    }

    # Disable favicon logs
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}